name: Update news and publish site

on:
  schedule:
    # Every day at 11:00 UTC (7 AM US Eastern in summer, 6 AM in winter).
    # For updates every 6 hours instead, use: "0 */6 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsmap
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's news
        # If every feed is down, keep publishing yesterday's data instead of failing.
        continue-on-error: true
        run: python3 scripts/fetch_news.py

      - name: Save the new data to the repository
        run: |
          git config user.name "newsmap-bot"
          git config user.email "newsmap-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
